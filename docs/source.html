    Coin(pro2::Pt pos) : pos_(pos), collected_(false), initial_y(pos.y) {}

    pro2::Rect get_rect() const {

#define FINDER_HH

#include <cmath>
#include <map>
#include <set>
#include "geometry.hh"

template <typename T>
class Finder {
private:
    const int cellSize = 40;
    std::map<std::pair<int, int>, std::set<const T*>> grid;

    void gridRange(const pro2::Rect& element_rect, pro2::Rect& tiles) const {
        tiles.bottom = floor(element_rect.bottom / cellSize);
        tiles.top    = floor(element_rect.top    / cellSize);
        tiles.left   = floor(element_rect.left   / cellSize);
        tiles.right  = floor(element_rect.right  / cellSize);
    }

public:
    Finder() {}

    void add(const T* t) {
        pro2::Rect tiles;
        gridRange(t->get_rect(), tiles);
        for (int y = tiles.top; y <= tiles.bottom; ++y)
            for (int x = tiles.left; x <= tiles.right; ++x)
                grid[{x, y}].insert(t);
    }

    void remove(const T* t) {
        pro2::Rect tiles;
        gridRange(t->get_rect(), tiles);
        for (int y = tiles.top; y <= tiles.bottom; ++y) {
            for (int x = tiles.left; x <= tiles.right; ++x) {
                auto it = grid.find({x, y});
                if (it != grid.end()) {
                    it->second.erase(t);
                    if (it->second.empty()) grid.erase(it);
                }
            }
        }
    }

    void update(const T* t) { remove(t); add(t); }

    std::set<const T*> query(pro2::Rect window_rect) const {
        std::set<const T*> result;
        pro2::Rect tiles;
        gridRange(window_rect, tiles);
        for (int y = tiles.top; y <= tiles.bottom; ++y)
            for (int x = tiles.left; x <= tiles.right; ++x) {
                auto it = grid.find({x, y});
                if (it != grid.end())
                    for (const auto& p : it->second)
                        result.insert(p);
            }
        return result;
    }
};

#endif`,

using namespace pro2;

Game::Game(int width, int height)
    : mario_({width / 2, 150}),
      platforms_{
          Platform(100, 300, 200, 211),
          Platform(0, 200, 250, 261),
          Platform(250, 400, 150, 161),
      },

      score_(1) {
    assert(width > 0 && height > 0, "L'amplada i l'alcada del joc han de ser positives.");
    for (int i = 1; i < 20; i++) {
        platforms_.push_back(Platform(250 + i * 200, 400 + i * 200, 150, 161));
        coins_.push_back(Coin({250 + i * 200, 140}));
        coins_.push_back(Coin({250 + i * 200 - 60, 140}));
        coins_.push_back(Coin({250 + i * 200 + 60, 140}));
    }
    for (const auto& p : platforms_) platform_finder_.add(&p);
    for (const auto& c : coins_)     coin_finder_.add(&c);
}

void Game::process_keys(pro2::Window& window) {
    if (window.is_key_down(Keys::Escape)) {
        finished_ = true;
        return;
    }
}

void Game::update_objects(pro2::Window& window) {
    std::vector<Platform> nearby;
    Rect aux = mario_.get_rect();
    aux.left -= 480; aux.right += 480;
    aux.top -= 480; aux.bottom += 480;
    for (const Platform* p : platform_finder_.query(aux))
        nearby.push_back(*p);
    mario_.update(window, nearby);

    Rect mariorect = mario_.get_rect();
    Rect visible = window.camera_rect();
    for (Coin& c : coins_) {
        if (!c.is_collected() && overlaps(c.get_rect(), visible)) {
            c.update(window.frame_count());
            if (overlaps(c.get_rect(), mariorect)) {
                c.collect();
                coin_finder_.remove(&c);
                std::cout << "You have " << score_++ << " coins.\\n";
            }
        }
    }
}

void Game::update_camera(pro2::Window& window) {
    const Pt pos = mario_.pos();
    const Pt cam = window.camera_center();
    const int left   = cam.x - window.width()  / 4;
    const int right  = cam.x + window.width()  / 4;
    const int top    = cam.y - window.height() / 4;
    const int bottom = cam.y + window.height() / 4;
    int dx = 0, dy = 0;
    if (pos.x > right)       dx = pos.x - right;
    else if (pos.x < left)   dx = pos.x - left;
    if (pos.y < top)         dy = pos.y - top;
    else if (pos.y > bottom) dy = pos.y - bottom;
    window.move_camera({dx, dy});
}

void Game::update(pro2::Window& window) {
    process_keys(window);
    update_objects(window);
    update_camera(window);
}

void Game::paint(pro2::Window& window) {
    window.clear(sky_blue);
    Rect visible = window.camera_rect();
    for (const Platform* p : platform_finder_.query(visible))
        p->paint(window);
    for (const Coin* c : coin_finder_.query(visible))
        c->paint_coin(window);
    mario_.paint(window);
}`,

namespace pro2 {

struct Pt {
    int x = 0, y = 0;
};

inline bool operator<(const Pt& a, const Pt& b) {
    return a.x != b.x ? a.x < b.x : a.y < b.y;
}

struct Rect {
    int left, top, right, bottom;
};

inline bool overlaps(const Rect& a, const Rect& b) {
    return !(a.right < b.left || a.left > b.right ||
             a.bottom < b.top || a.top > b.bottom);
}

}

#endif`,

void Mario::apply_physics_() {
    if (grounded_) { speed_.y = 0; accel_.y = 0; }
    const int gravity = 1;
    speed_.y += gravity;
    if (accel_time_ > 0) { speed_.y += accel_.y; accel_time_--; }
    pos_.x += speed_.x;
    pos_.y += speed_.y;
}

    if (grounded_) {
        accel_.y = -6;
        grounded_ = false;
        accel_time_ = 2;

void Mario::update(pro2::Window& window, const vector<Platform>& platforms) {
    last_pos_ = pos_;

    speed_.x = 0;
    if (window.is_key_down(Keys::Left))       speed_.x = -4;
    else if (window.is_key_down(Keys::Right)) speed_.x = 4;
    if (speed_.x != 0) looking_left_ = speed_.x < 0;
    apply_physics_();
    set_grounded(false);
    for (const Platform& platform : platforms) {
        if (platform.has_crossed_floor_downwards(last_pos_, pos_)) {
            set_grounded(true);
            set_y(platform.top());
        }
    }

    assert(!platform_texture_.empty() && !platform_texture_[0].empty(),

#include "window.hh"
using std::string;

namespace pro2 {

Window::Window(string title, int width, int height, int zoom)
    : fenster_{.title = title.c_str(), .width = width * zoom, .height = height * zoom},
      zoom_(zoom),
      pixels_size_(width * height * zoom * zoom) {
    pixels_ = new uint32_t[width * height * zoom * zoom];
    fenster_.buf = pixels_;
    fenster_open(&fenster_);
    last_time_ = fenster_time();
}

void Window::update_camera_() {
    if (topleft_.x < topleft_target_.x)
        topleft_.x += std::min(camera_speed_, topleft_target_.x - topleft_.x);
    else if (topleft_.x > topleft_target_.x)
        topleft_.x -= std::min(camera_speed_, topleft_.x - topleft_target_.x);
    if (topleft_.y < topleft_target_.y)
        topleft_.y += std::min(camera_speed_, topleft_target_.y - topleft_.y);
    else if (topleft_.y > topleft_target_.y)
        topleft_.y -= std::min(camera_speed_, topleft_.y - topleft_target_.y);
}

bool Window::next_frame() {
    update_camera_();
    int wait = int(1000.0 / fps_) - (fenster_time() - last_time_);
    if (wait > 0) fenster_sleep(wait);
    last_time_ = fenster_time();
    frame_count_++;
    for (size_t i = 0; i < 256; i++) last_keys_[i] = fenster_.keys[i];
    last_mouse_ = fenster_.mouse;
    return fenster_loop(&fenster_) == 0;
}

void Window::clear(Color color) {
    for (size_t i = 0; i < pixels_size_; i++) pixels_[i] = color;
}

void Window::set_pixel(Pt pt, Color color) {
    const Pt camera_pt = {pt.x - topleft_.x, pt.y - topleft_.y};
    for (int i = 0; i < zoom_; i++)
        for (int j = 0; j < zoom_; j++) {
            const int _i = camera_pt.x * zoom_ + i;
            const int _j = camera_pt.y * zoom_ + j;
            if (_i >= 0 && _i < fenster_.width && _j >= 0 && _j < fenster_.height)
                fenster_pixel(&fenster_, _i, _j) = color;
        }
}

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function highlight(raw) {
        // Handle #include lines first
        if (/^\s*#include/.test(raw)) {
          const e = raw
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/(#include)/, '<span class="pp">$1</span>')
            .replace(
              /(&quot;[^&]*&quot;|&lt;[^&]*&gt;)/,
              '<span class="str">$1</span>',
            );
          return e;
        }

        const types = new Set([
          "vector",
          "set",
          "map",
          "pair",
          "string",
          "size_t",
          "uint32_t",
          "int64_t",
          "int32_t",
          "Window",
          "Rect",
          "Pt",
          "Color",
          "Finder",
          "Platform",
          "Coin",
          "Mario",
          "Game",
        ]);
        const kws = new Set([
          "template",
          "typename",
          "class",
          "struct",
          "namespace",
          "using",
          "public",
          "private",
          "protected",
          "const",
          "constexpr",
          "static",
          "inline",
          "return",
          "for",
          "while",
          "if",
          "else",
          "true",
          "false",
          "new",
          "delete",
          "nullptr",
          "this",
          "sizeof",
          "explicit",
          "void",
          "int",
          "bool",
          "double",
          "float",
          "auto",
          "char",
          "long",
          "short",
          "unsigned",
        ]);

        // tokenize: strings, comments, words, numbers, other chars
        const tokens =
          raw.match(
            /(\/\/[^\n]*)|(#\w+)|("(?:[^"\\]|\\.)*")|(\b0x[0-9a-fA-F]+\b)|(\b\d+\b)|([a-zA-Z_]\w*)|([^\w])/g,
          ) || [];

        return tokens
          .map((tok, i) => {
            const e = tok
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            if (tok.startsWith("//")) return `<span class="cm">${e}</span>`;
            if (tok.startsWith("#")) return `<span class="pp">${e}</span>`;
            if (tok.startsWith('"')) return `<span class="str">${e}</span>`;
            if (/^0x[\da-fA-F]+$/.test(tok) || /^\d+$/.test(tok))
              return `<span class="num">${e}</span>`;
            if (types.has(tok)) return `<span class="tp">${e}</span>`;
            if (kws.has(tok)) return `<span class="kw">${e}</span>`;
            // check if next non-space token is '(' → function
            if (/^[a-zA-Z_]\w*$/.test(tok)) {
              const rest = raw
                .slice(raw.indexOf(tok, i === 0 ? 0 : 0))
                .replace(tok, "");
              const after = tokens
                .slice(i + 1)
                .join("")
                .trimStart();
              if (after.startsWith("(")) return `<span class="fn">${e}</span>`;
            }
            return e;
          })
          .join("");
      }

      function addLineNumbers(code) {
        return code
          .split("\n")
          .map(
            (line, i) =>
              `<span class="line-num">${i + 1}</span>${highlight(line)}`,
          )
          .join("\n");
      }
